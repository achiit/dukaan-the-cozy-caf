<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The Cozy Café</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pacifico&family=Inter:wght@400;600&display=swap">
<style>
:root{--bg:#141110;--card:#1F1A17;--ink:#F7F1E8;--acc:#F5B800;--onacc:#141110;--line:#4A3A22;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#FBF5E9;--card:#FFFFFF;--ink:#2B1D14;--acc:#8A5A00;--onacc:#FFFFFF;--line:#E6D5B0}}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,sans-serif}
main{max-width:720px;margin:0 auto;padding:24px 16px 200px;display:flex;flex-direction:column;gap:20px}
h1,h2{font-family:Pacifico,Georgia,cursive;font-weight:400;margin:0;color:var(--acc)}
h1{font-size:40px;text-align:center}
.tag{text-align:center;opacity:.8;margin-top:-12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:12px}
.row{display:flex;justify-content:space-between;align-items:center;gap:12px}
button{font:inherit;font-weight:600;background:var(--acc);color:var(--onacc);border:0;border-radius:999px;padding:12px 20px;min-height:44px;cursor:pointer}
button.q{width:44px;padding:0;font-size:20px}
select{font:inherit;color:inherit;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px;min-height:44px}
.pr{color:var(--acc);font-weight:600}
#bar{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px))}
#bar>div{max-width:720px;margin:0 auto;display:flex;flex-direction:column;gap:10px}
[hidden]{display:none!important}
</style>
</head>
<body>
<main>
<h1>The Cozy Café</h1>
<div class="tag">Good Food • Good Mood</div>
<div id="menu" style="display:flex;flex-direction:column;gap:20px"></div>
<section id="own" class="card" hidden>
<h2 style="font-size:26px">Incoming orders (cafe only)</h2>
<div id="list" style="display:flex;flex-direction:column;gap:12px"></div>
</section>
</main>
<div id="bar"><div>

const WA="917050519597"; // cafe WhatsApp number with country code
const qty={},$=id=>document.getElementById(id);
function el(t,x,st){const e=document.createElement(t);if(x!=null)e.textContent=x;if(st)e.style.cssText=st;return e}
const sel=$("tb");for(let i=1;i<=10;i++)sel.append(new Option("Table "+i,i));
function total(){let t=0;M.forEach(c=>c[1].forEach(i=>t+=(qty[i[0]]||0)*i[1]));return t}
function upd(){$("tot").textContent="Total: ₹"+total()}
function draw(){
  const box=$("menu");box.replaceChildren();
  M.forEach(c=>{
    const s=el("section");s.className="card";s.append(el("h2",c[0],"font-size:26px"));
    c[1].forEach(i=>{
      const r=el("div");r.className="row";
      const left=el("div",null,"display:flex;align-items:center;gap:12px;flex:1;min-width:0");
      if(IMG[i[0]]){const im=el("img");im.src=IMG[i[0]];im.alt=i[0];im.style.cssText="width:72px;height:72px;object-fit:cover;border-radius:12px;flex:none";left.append(im)}
      const l=el("div",null,"display:flex;flex-direction:column;gap:2px");const pp=el("span","₹"+i[1]);pp.className="pr";l.append(el("span",i[0]),pp);left.append(l);
      const k=el("div",null,"display:flex;align-items:center;gap:10px");
      const m=el("button","−");m.className="q";m.setAttribute("aria-label","Remove "+i[0]);
      const v=el("span",String(qty[i[0]]||0),"min-width:20px;text-align:center");
      const p=el("button","+");p.className="q";p.setAttribute("aria-label","Add "+i[0]);
      m.onclick=()=>{qty[i[0]]=Math.max(0,(qty[i[0]]||0)-1);v.textContent=qty[i[0]];upd()};
      p.onclick=()=>{qty[i[0]]=(qty[i[0]]||0)+1;v.textContent=qty[i[0]];upd()};
      k.append(m,v,p);r.append(left,k);s.append(r);
    });
    box.append(s);
  });
}
draw();
let db=null,uid=null;
(async()=>{
  try{
    const user=await claude.use("user");
    db=await claude.use("db");
    try{uid=await user.id()}catch(e){}
    if(db&&user&&user.canEdit()){
      $("own").hidden=false;
      db.collection("orders").onSnapshot(s=>{
        const L=$("list");L.replaceChildren();
        const all=[];
        s.docs.forEach(d=>{const o=d.data()||{};(o.orders||[]).forEach((x,i)=>all.push({id:d.id,i,x,all:o.orders}))});
        all.sort((p,q)=>q.x.at-p.x.at);
        if(!all.length)L.append(el("div","No orders yet.","opacity:.75"));
        all.forEach(r=>{
          const o=r.x;
          const w=el("div",null,"border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:6px");
          w.append(el("strong","Table "+o.table,"font-size:20px"));
          (o.items||[]).forEach(i=>w.append(el("span",i.q+" x "+i.n)));
          w.append(el("span","Total: ₹"+o.total+" • "+(o.done?"Done":"New"),"opacity:.8;font-size:14px"));
          if(!o.done){const b=el("button","Mark done");b.onclick=()=>{const a=r.all.map((z,k)=>k===r.i?Object.assign({},z,{done:true}):z);db.doc("orders/"+r.id).update({orders:a})};w.append(b)}
          L.append(w);
        });
      },()=>{});
    }
  }catch(e){}
})();
$("go").onclick=async()=>{
  const items=[];M.forEach(c=>c[1].forEach(i=>{if(qty[i[0]])items.push({n:i[0],q:qty[i[0]],p:i[1]})}));
  const table=sel.value;
  if(!table){$("msg").textContent="Please select your table number.";return}
  if(!items.length){$("msg").textContent="Please add at least one item.";return}
  const text="New order - Table "+table+"\n"+items.map(i=>i.q+" x "+i.n+" = ₹"+(i.q*i.p)).join("\n")+"\nTotal: ₹"+total();
  const url="https://wa.me/"+WA+"?text="+encodeURIComponent(text);
  try{
    if(db&&uid){
      const ref=db.doc("orders/"+uid);
      let prev=[];
      try{const sn=await ref.get();const d=sn.data();if(d&&d.orders)prev=d.orders}catch(e){}
      await ref.set({orders:prev.concat([{table:Number(table),items,total:total(),done:false,at:Date.now()}])});
    }
  }catch(e){}
  for(const k in qty)qty[k]=0;draw();upd();
  const m=$("msg");m.replaceChildren(el("div","Almost done! Tap below to send your order on WhatsApp."));
  const a=el("a","Send order on WhatsApp","display:inline-block;margin-top:8px;background:var(--acc);color:var(--onacc);padding:12px 20px;border-radius:999px;font-weight:600;text-decoration:none");
  a.href=url;a.target="_blank";a.rel="noopener";m.append(a);
  window.open(url,"_blank","noopener");
};
</script>
</body>
